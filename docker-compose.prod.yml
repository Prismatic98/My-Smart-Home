# Produktions-Stack der App auf dem Raspberry Pi.
#
#   cp .env.prod.example .env.prod        # einmalig, Token eintragen
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Home Assistant läuft als eigener Container (~/docker/docker-compose.yml)
# und wird hier nur über den Reverse-Proxy angesprochen.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Aus .env.prod (nicht im Repo). Vite backt die Werte in das Bundle –
        # nach einer Änderung an .env.prod muss neu gebaut werden.
        # Leer = App spricht Home Assistant über die eigene Origin an.
        #
        # Bewusst mit :- statt :? — Compose interpoliert bei JEDEM Unterkommando,
        # ein Pflicht-Guard würde also auch `logs`, `ps` oder `down` blockieren,
        # sobald --env-file fehlt. Dass der Token da ist, prüft das Dockerfile.
        VITE_HA_URL: ${VITE_HA_URL:-}
        VITE_HA_TOKEN: ${VITE_HA_TOKEN:-}
    image: my-smart-home:latest
    container_name: my-smart-home
    restart: unless-stopped
    # Damit Caddy Home Assistant unter 127.0.0.1:8123 erreicht: der
    # HA-Container läuft selbst mit network_mode: host, beide teilen sich
    # also das Loopback des Pi. Kein ports:-Mapping nötig – Caddy lauscht
    # direkt auf Port 8080 des Hosts.
    network_mode: host
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: my-smart-home-backend:latest
    container_name: my-smart-home-backend
    restart: unless-stopped
    # Ebenfalls Host-Netz, damit Caddy den Server unter 127.0.0.1:3001 findet.
    network_mode: host
    environment:
      DB_PATH: /data/notes.db
      # Wurzel der Dateiablage. Alles, was hochgeladen wird, landet darunter.
      FILES_ROOT: /data/files
      # Bilder aus Notizen. Liegt innerhalb des /data-Mounts, braucht also
      # keinen eigenen Bind-Mount – nur diesen Pfad, weil der Standard relativ
      # zum Arbeitsverzeichnis im Container zeigen würde.
      NOTE_IMAGES_ROOT: /data/note-images
      PORT: "3001"
      # NUR auf dem Loopback lauschen. Im Host-Netz wäre 0.0.0.0 sonst offen
      # im LAN – erreichbar sein soll der Server ausschließlich über Caddy.
      HOST: 127.0.0.1
    volumes:
      # Verzeichnis, nicht die einzelne Datei: SQLite legt im WAL-Modus
      # notes.db-wal und notes.db-shm daneben.
      # Muss vor dem ersten Start existieren und uid 1000 gehören, sonst legt
      # Docker es als root an und der Container darf nicht hineinschreiben.
      - ${BACKEND_DATA_DIR:-./data}:/data
      # Eigener Mount für die Dateien. Standardmäßig liegt er innerhalb des
      # Verzeichnisses darüber – der separate Eintrag existiert, damit sich
      # die Ablage später auf eine andere Platte verschieben lässt, ohne die
      # Datenbank mitzunehmen. Bei überlappenden Mounts gewinnt der längere
      # Pfad, die Reihenfolge hier spielt keine Rolle.
      - ${FILES_DATA_DIR:-./data/files}:/data/files
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"